name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (in-memory state, offline planner, no keys)
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      # logs need a GitHub sign-in; annotations are public, so the counts are checkable by anyone
      - name: Report test counts
        if: always()
        run: node -e "const r=require('./test-results/vitest.json');console.log('::notice title=Tests::'+r.numPassedTests+' passed, '+r.numFailedTests+' failed, '+r.numTotalTests+' total in '+r.numTotalTestSuites+' suites')"
      - name: Build
        run: npm run build
      # after the build, so next-env.d.ts and the generated route types exist
      - name: Typecheck
        run: npm run typecheck
